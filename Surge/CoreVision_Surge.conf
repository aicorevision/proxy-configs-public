[General]
loglevel = notify
proxy-test-url = http://www.gstatic.com/generate_204

[Proxy Group]
手动选择 = select, DIRECT, include-all-proxies=true
自动选择 = url-test, DIRECT, include-all-proxies=true, interval=600
香港节点 = select, DIRECT, include-all-proxies=true, policy-regex-filter="香港|HK|Hong Kong"
美国节点 = select, DIRECT, include-all-proxies=true, policy-regex-filter="美国|US|United States"
日本节点 = select, DIRECT, include-all-proxies=true, policy-regex-filter="日本|JP|Japan"
台湾节点 = select, DIRECT, include-all-proxies=true, policy-regex-filter="台湾|TW|Taiwan"
新加坡节点 = select, DIRECT, include-all-proxies=true, policy-regex-filter="新加坡|SG|Singapore"
静态IP = select, DIRECT, include-all-proxies=true, policy-regex-filter="静态|住宅|Static"
苹果服务 = select, 自动选择, 手动选择, 香港节点, 美国节点, 日本节点, 台湾节点, 新加坡节点, 静态IP, DIRECT
